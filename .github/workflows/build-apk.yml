name: Build Arrow Puzzle APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unzip Game Project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o arrow-puzzle.zip -d extracted

          echo "=== ZIP CONTENT ==="
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android Project
        run: |
          echo "Searching for Gradle Android project..."

          GRADLEW=$(find extracted -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The ZIP must contain an Android/Capacitor project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Web Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          elif find extracted -maxdepth 4 -name package.json | grep -q .; then
            APP_DIR=$(find extracted -maxdepth 4 -name package.json -printf '%h\n' | head -1)
            cd "$APP_DIR"
            npm install
          fi

      - name: Prepare Gradle
        run: |
          cd "$ANDROID_PROJECT"
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android APK
        run: |
          cd "$ANDROID_PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find "$ANDROID_PROJECT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Puzzle-Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
